<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="BTC SIGNALは判定システムを点検・再構築しています。新しい判定の自動公開を停止しています。">
  <title>BTC SIGNAL — 判定システム点検中</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; color: #192734; background: #f8f9fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header, main, footer { width: min(100% - 48px, 880px); margin-inline: auto; }
    header { padding: 36px 0; border-bottom: 1px solid #d5dce0; }
    .brand { font-size: 20px; font-weight: 750; letter-spacing: .06em; }
    main { padding: 72px 0 88px; }
    .status { color: #315d77; font-size: 14px; font-weight: 650; letter-spacing: .04em; }
    h1 { font-size: clamp(25px, 5vw, 36px); line-height: 1.5; font-weight: 600; margin: 20px 0 28px; }
    .notice { max-width: 42em; font-size: 17px; line-height: 2.1; margin: 0; }
    .record-date { margin: 40px 0 0; color: #596b77; font-size: 13px; line-height: 1.8; }
    footer { border-top: 1px solid #d5dce0; padding: 24px 0; color: #596b77; font-size: 13px; line-height: 1.8; }
    @media (max-width: 540px) { header, main, footer { width: calc(100% - 36px); } main { padding-block: 44px 56px; } .notice { font-size: 16px; } }
  </style>
</head>
<body>
  <header><span class="brand">BTC SIGNAL</span></header>
  <main>
    <div class="status">新しい判定の自動公開を停止しています</div>
    <h1>判定システムの点検について</h1>
    <p class="notice">判定システムを点検・再構築しています。過去の一部記録には、計算失敗時の代入値が含まれることを確認しました。過去ログは原本を保存し、正常に計算された判定とは区別しています。現在、新しい判定の自動公開を停止しています。</p>
    <p class="record-date">旧システムの原本に残る最終記録日：2026-09-20</p>
  </main>
  <footer>BTCの判定結果を保存する記録システムです。このサイトで売買は行いません。</footer>
</body>
</html>
