name: Record and publish BTC signal

# One daily trigger, 20 minutes after UTC midnight. No push/watchdog triggers.
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: record=前UTC日を記録 / publish_only=保存済み結果を公開 / notify_only=通知だけ
        required: true
        default: record
        type: choice
        options: [record, publish_only, notify_only]
      record_file:
        description: 再公開・再通知時だけ records/SMA100_CLOSE_V1/YYYY-MM-DD.json
        type: string
        default: ''

permissions: {}

concurrency:
  group: btc-signal-record-production
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      pages: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - name: Offline calculation tests (record mode only)
        if: github.event_name == 'schedule' || inputs.mode == 'record'
        run: python3 -m unittest discover -s tests -v
      - name: Original history protection (all modes)
        run: python3 scripts/verify_history.py
      - name: Record, preserve through PR, publish, then notify
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPERATION_MODE: ${{ github.event_name == 'schedule' && 'record' || inputs.mode }}
          RECORD_FILE: ${{ inputs.record_file }}
        run: python3 scripts/operate.py --mode "$OPERATION_MODE" --record-file "$RECORD_FILE"
