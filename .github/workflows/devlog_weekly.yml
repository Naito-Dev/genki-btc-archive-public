name: DevLog Weekly

on:
  schedule:
    - cron: "0 13 * * 3" # Wed 22:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: devlog-weekly
  cancel-in-progress: false

jobs:
  devlog-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate weekly Dev Log payloads
        id: gen
        run: |
          set +e
          mkdir -p .tmp/devlog
          python scripts/generate_devlog_weekly.py \
            --repo "${{ github.repository }}" \
            --out-discord ".tmp/devlog/discord.txt" \
            --out-meta ".tmp/devlog/meta.json" \
            > .tmp/devlog/generate.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            reason=$(python - <<'PY'
          from pathlib import Path
          txt = Path(".tmp/devlog/generate.log").read_text(encoding="utf-8", errors="ignore")
          marker = "DEVLOG_FAIL:"
          idx = txt.find(marker)
          if idx >= 0:
              line = txt[idx:].splitlines()[0].strip()
              print(line)
          else:
              print("DEVLOG_FAIL:generator_failed")
          PY
            )
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path(".tmp/devlog/meta.json")
          if not p.exists():
              print("fail")
              raise SystemExit
          j = json.loads(p.read_text(encoding="utf-8"))
          print(str(j.get("status") or "fail"))
          PY
          )
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$status" = "noop" ]; then
            echo "reason=doc_exists" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage docs output
        if: ${{ steps.gen.outputs.status == 'ok' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path(".tmp/devlog/meta.json").read_text(encoding="utf-8"))
          p = Path(meta["doc_path"])
          if p.exists():
              print(f"staging {p}")
              import subprocess
              subprocess.check_call(["git","add",str(p)])
          PY

      - name: Detect staged docs changes
        if: ${{ always() }}
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR (docs only)
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add weekly devlog"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: "automation/devlog-weekly-${{ github.run_id }}"
          base: "main"
          delete-branch: true
          title: "docs: add weekly devlog"
          body: |
            Automated weekly Dev Log (facts-only).
          add-paths: |
            docs/devlog/*.md

      - name: Enable auto-merge (squash)
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --delete-branch

      - name: Post Discord success (DEVLOG_OK)
        if: ${{ steps.gen.outputs.status == 'ok' || steps.gen.outputs.status == 'noop' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD1 || secrets.DISCORD }}
          GEN_STATUS: ${{ steps.gen.outputs.status }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DEVLOG_OK notify failed: missing discord webhook"
            exit 1
          fi

          payload=$(python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          st = os.getenv("GEN_STATUS", "ok")
          meta = json.loads(Path(".tmp/devlog/meta.json").read_text(encoding="utf-8"))
          week_ending = str(meta.get("week_ending") or "").strip()
          doc_path = str(meta.get("doc_path") or "").strip()
          if not week_ending:
              m = re.search(r"(\d{4}-\d{2}-\d{2})\.md$", doc_path)
              week_ending = m.group(1) if m else "unknown"
          doc_url = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/blob/main/docs/devlog/{week_ending}.md"
          pr_url = os.getenv("PR_URL", "").strip()
          run_url = os.getenv("RUN_URL", "").strip()

          lines = [
              "DEVLOG_OK",
              f"week ending {week_ending}",
          ]
          if pr_url:
              lines.append(f"pr: {pr_url}")
          else:
              lines.append(f"doc: {doc_url}")
          lines.append(f"run_url: {run_url}")
          if st == "noop":
              lines.append("note: NOOP (doc already exists)")

          print(json.dumps({"content": "\n".join(lines)}, ensure_ascii=False))
          PY
          )

          code=$(curl -sS -o /tmp/discord_body.txt -w "%{http_code}"             -H "Content-Type: application/json"             -d "$payload"             "$DISCORD_WEBHOOK_URL")

          echo "discord_http_code=$code"
          echo "discord_response_body:"
          cat /tmp/discord_body.txt || true

          test "$code" = "204"

      - name: Post Discord failure (DEVLOG_FAIL)
        if: ${{ steps.gen.outputs.status == 'fail' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD1 || secrets.DISCORD }}
          GEN_REASON: ${{ steps.gen.outputs.reason || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DEVLOG_FAIL notify failed: missing discord webhook"
            exit 1
          fi

          payload=$(python - <<'PY'
          import json
          import os

          reason = os.getenv("GEN_REASON", "unknown").strip()
          run_url = os.getenv("RUN_URL", "").strip()
          content = f"DEVLOG_FAIL:{reason}\nrun_url: {run_url}"
          print(json.dumps({"content": content}, ensure_ascii=False))
          PY
          )

          code=$(curl -sS -o /tmp/discord_body.txt -w "%{http_code}"             -H "Content-Type: application/json"             -d "$payload"             "$DISCORD_WEBHOOK_URL")

          echo "discord_http_code=$code"
          echo "discord_response_body:"
          cat /tmp/discord_body.txt || true

          test "$code" = "204"

      - name: Fail workflow on DEVLOG_FAIL
        if: ${{ steps.gen.outputs.status == 'fail' }}
        run: |
          echo "DEVLOG_FAIL:${{ steps.gen.outputs.reason || 'unknown' }}"
          exit 1
