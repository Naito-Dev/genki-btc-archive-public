name: Daily Archive Update

on:
  schedule:
    - cron: "5 11 * * *" # 20:05 JST primary daily prep; deterministic publish at 20:10 JST
    - cron: "8 11 * * *" # 20:08 JST retry if GitHub drops/delays the primary schedule
    - cron: "12 11 * * *" # 20:12 JST retry
    - cron: "16 11 * * *" # 20:16 JST retry
    - cron: "20 11 * * *" # 20:20 JST final retry
    - cron: "32 11 * * *" # 20:32 JST missed-run check
  workflow_dispatch:
    inputs:
      private_result_b64:
        description: "base64 encoded private_signal_result.json"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-archive
  cancel-in-progress: false

jobs:
  precheck-idempotency:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule != '32 11 * * *' }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check if already published today (JST)
        id: check
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          out = Path(os.environ["GITHUB_OUTPUT"])
          today_jst = datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          should_run = True
          skip_reason = ""

          p = Path("btcsignal_log_live.json")
          try:
              if p.exists():
                  j = json.loads(p.read_text(encoding="utf-8"))
                  entries = j.get("entries") or []
                  latest = entries[-1] if entries else {}
                  latest_date = str((latest or {}).get("date") or "").strip()[:10]
                  if latest_date and latest_date == today_jst:
                      should_run = False
                      skip_reason = "already_published_today_jst"
          except Exception:
              # Fail-open for idempotency check itself: still run daily pipeline.
              should_run = True
              skip_reason = ""

          with out.open("a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
              f.write(f"skip_reason={skip_reason}\n")
          PY

  run-daily:
    needs: precheck-idempotency
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule != '32 11 * * *') && needs.precheck-idempotency.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deterministic publish gate (20:10 JST / 11:10 UTC ±120s)
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            NOW_UTC="$(date -u +%FT%TZ)"
            {
              echo "PUBLISHED_AT_UTC=${NOW_UTC}"
              echo "PUBLISH_TARGET_UTC=MANUAL"
              echo "PUBLISH_DELAY_SEC=0"
              echo "PUBLISH_SLO_STATUS=MANUAL"
              echo "FORCE_TODAY=0"
            } >> "$GITHUB_ENV"
            echo "publish_gate mode=manual published_at_utc=${NOW_UTC} delay_sec=0 SLO=MANUAL"
            exit 0
          fi

          TODAY_UTC="$(date -u +%F)"
          TARGET_UTC="${TODAY_UTC}T11:10:00Z"
          TARGET_EPOCH="$(date -u -d "${TARGET_UTC}" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          WAIT_SEC=$(( TARGET_EPOCH - NOW_EPOCH ))
          if [ "${WAIT_SEC}" -gt 0 ]; then
            sleep "${WAIT_SEC}"
          fi

          PUBLISHED_AT_UTC="$(date -u +%FT%TZ)"
          PUBLISHED_EPOCH="$(date -u +%s)"
          DELAY_SEC=$(( PUBLISHED_EPOCH - TARGET_EPOCH ))
          if [ "${DELAY_SEC}" -lt 0 ]; then DELAY_SEC=0; fi

          if [ "${DELAY_SEC}" -le 120 ]; then
            SLO_STATUS="OK"
          else
            SLO_STATUS="VIOLATION"
          fi

          {
            echo "PUBLISHED_AT_UTC=${PUBLISHED_AT_UTC}"
            echo "PUBLISH_TARGET_UTC=${TARGET_UTC}"
            echo "PUBLISH_DELAY_SEC=${DELAY_SEC}"
            echo "PUBLISH_SLO_STATUS=${SLO_STATUS}"
            echo "FORCE_TODAY=1"
          } >> "$GITHUB_ENV"
          echo "publish_gate target=${TARGET_UTC} published_at_utc=${PUBLISHED_AT_UTC} delay_sec=${DELAY_SEC} SLO=${SLO_STATUS}"

      - name: Generate daily_input.env from Bitget read-only snapshot
        continue-on-error: true
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
        run: |
          python scripts/generate_daily_input_env.py

      - name: Ensure daily_input.env fallback exists
        run: |
          mkdir -p .runtime
          if [ -f .runtime/daily_input.env ]; then
            exit 0
          fi
          NOW_UTC="$(date -u +%FT%TZ)"
          cat > .runtime/daily_input.env <<EOF
          SNAPSHOT_STATUS=SYNC_PENDING
          BALANCE_SOURCE=unavailable
          BALANCE_TS_UTC=${NOW_UTC}
          BTC_UNITS=
          USDT_UNITS=
          SNAPSHOT_REASON=daily_input_missing_after_bitget_step
          EOF

      - name: Run daily log update
        id: run_daily
        env:
          DRY_RUN: "0"
          DAILY_CUTOFF_JST: "09:00"
          PUBLISHED_AT_UTC: ${{ env.PUBLISHED_AT_UTC }}
        run: |
          set +e
          python scripts/run_daily.py 2>&1 | tee .run_daily.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            chain_line="$(grep -n 'chain validation failed:' .run_daily.log | tail -n1 | sed 's/^.*chain validation failed: //')"
            if [ -n "${chain_line}" ]; then
              echo "DAILY_FAIL_REASON=chain_broken:${chain_line}" >> "$GITHUB_ENV"
            else
              echo "DAILY_FAIL_REASON=unknown" >> "$GITHUB_ENV"
            fi
          fi
          exit "$rc"

      - name: Materialize private BTCSIGNAL result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_result_b64 != '' }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          printf %s '${{ inputs.private_result_b64 }}' | base64 --decode > .runtime/private_signal_result.json
          test -s .runtime/private_signal_result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path(".runtime/private_signal_result.json")
          j = json.loads(p.read_text(encoding="utf-8"))
          print("OK: materialized private result")
          print("keys:", sorted(j.keys()))
          PY

      - name: Import private BTCSIGNAL result
        id: import_private
        run: |
          set +e
          python scripts/import_private_signal_result.py 2>&1 | tee .import_private.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            reason_line="$(tail -n1 .import_private.log | tr -d "\r")"
            if [ -n "${reason_line}" ]; then
              echo "DAILY_FAIL_REASON=${reason_line}" >> "$GITHUB_ENV"
            else
              echo "DAILY_FAIL_REASON=private_signal_import_failed" >> "$GITHUB_ENV"
            fi
          fi
          exit "$rc"

      - name: Wait for published_at readiness
        id: published_ready
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          out = Path(os.environ["GITHUB_OUTPUT"])
          env = Path(os.environ["GITHUB_ENV"])
          target_date = datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          attempts = 3
          sleep_sec = 30

          def valid_iso_utc_z(value: str) -> bool:
              s = str(value or "").strip()
              if not s or not s.endswith("Z"):
                  return False
              try:
                  datetime.fromisoformat(s.replace("Z", "+00:00"))
              except Exception:
                  return False
              return True

          def latest_btcsignal_ts() -> str:
              path = Path("data/btcsignal_log.json")
              if not path.exists():
                  return ""
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return ""
              entries = data.get("entries") if isinstance(data, dict) else None
              if not isinstance(entries, list):
                  return ""
              for entry in reversed(entries):
                  if not isinstance(entry, dict):
                      continue
                  if str(entry.get("date") or "").strip()[:10] != target_date:
                      continue
                  return str(entry.get("published_at_utc") or "").strip()
              return ""

          def latest_core_ts() -> str:
              path = Path("data/log.json")
              if not path.exists():
                  return ""
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return ""
              latest = data.get("latest") if isinstance(data, dict) else None
              if not isinstance(latest, dict):
                  return ""
              if str(latest.get("date") or "").strip()[:10] != target_date:
                  return ""
              return str(latest.get("published_at_utc") or "").strip()

          ready = False
          detail = "published_at_not_ready"
          for attempt in range(1, attempts + 1):
              live_ts = latest_btcsignal_ts()
              core_ts = latest_core_ts()
              if valid_iso_utc_z(live_ts) or valid_iso_utc_z(core_ts):
                  ready = True
                  detail = f"ready_on_attempt_{attempt}"
                  break
              detail = f"published_at_not_ready:{target_date}:attempt_{attempt}:btcsignal={live_ts or 'missing'}:core={core_ts or 'missing'}"
              print(detail)
              if attempt < attempts:
                  time.sleep(sleep_sec)

          with out.open("a", encoding="utf-8") as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
              f.write(f"detail={detail}\n")
          if ready:
              raise SystemExit(0)

          with env.open("a", encoding="utf-8") as f:
              f.write(f"DAILY_FAIL_REASON={detail}\n")
          raise SystemExit(1)
          PY

      - name: Export BTCSIGNAL live decision log (seed excluded)
        id: export_live
        run: |
          set +e
          python scripts/export_btcsignal_live_log.py 2>&1 | tee .export_live.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            reason_line="$(grep -E 'ValueError: published_at_[^[:space:]]+' .export_live.log | tail -n1 | sed 's/^.*ValueError: //')"
            if [ -n "${reason_line}" ]; then
              echo "DAILY_FAIL_REASON=${reason_line}" >> "$GITHUB_ENV"
            else
              echo "DAILY_FAIL_REASON=published_at_missing" >> "$GITHUB_ENV"
            fi
          fi
          exit "$rc"

      - name: Ensure Live Testing baseline (2026-02-26)
        run: |
          python scripts/ensure_live_test_baseline.py --start-date-jst 2026-02-26

      - name: Execute Bitget from BTCSIGNAL (DRY_RUN first)
        continue-on-error: true
        env:
          DRY_RUN: ${{ vars.BITGET_EXEC_DRY_RUN || '1' }}
          BITGET_EXECUTE_ENABLED: ${{ vars.BITGET_EXECUTE_ENABLED || '0' }}
          BITGET_SYMBOL: ${{ vars.BITGET_SYMBOL || 'BTC/USDT' }}
          MIN_TRADE_USD: ${{ vars.MIN_TRADE_USD || '5' }}
          MIN_BTC_QTY: ${{ vars.MIN_BTC_QTY || '0.00001' }}
          MAX_NOTIONAL_USD: ${{ vars.MAX_NOTIONAL_USD || '10' }}
          EXECUTE_USDT_FRACTION: ${{ vars.EXECUTE_USDT_FRACTION || '0.1' }}
          EXECUTE_BTC_FRACTION: ${{ vars.EXECUTE_BTC_FRACTION || '0.1' }}
          ALLOW_LIVE: ${{ vars.ALLOW_LIVE || 'NO' }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
        run: |
          python scripts/bitget_execute_from_btcsignal.py

      - name: Notify Discord BTCSIGNAL proof
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD1 || secrets.DISCORD }}
        run: |
          python scripts/notify_btcsignal_discord.py --ops-status PASS

      - name: Notify Discord X draft (#x-posts)
        continue-on-error: true
        env:
          DISCORD_X_WEBHOOK_URL: ${{ secrets.DISCORD_X_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://btcsignal.org/' }}
        run: |
          python scripts/notify_x_draft_discord.py --ops-status PASS

      - name: Generate Substack Daily draft
        run: |
          python scripts/generate_substack_daily.py

      - name: Post to X (Phase 0, once per latest_date)
        if: ${{ always() }}
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USERNAME: ${{ vars.X_USERNAME || '' }}
        run: |
          set -euo pipefail

          # Fail-closed: only attempt posting when the daily workflow status file says ok.
          if [ ! -f substack/status.json ]; then
            echo "X_POST: skip (missing substack/status.json)"
            exit 0
          fi
          status=$(python -c 'import json;print(json.load(open("substack/status.json"))["status"])' 2>/dev/null || echo "")
          if [ "$status" != "ok" ]; then
            echo "X_POST: skip (status=$status)"
            exit 0
          fi

          # Require secrets; otherwise skip (test env).
          if [ -z "${X_API_KEY:-}" ] || [ -z "${X_API_SECRET:-}" ] || [ -z "${X_ACCESS_TOKEN:-}" ] || [ -z "${X_ACCESS_TOKEN_SECRET:-}" ]; then
            echo "X_POST: skip (missing X_* secrets)"
            exit 0
          fi

          python -m pip -q install requests requests_oauthlib

          thread_json=$(python scripts/generate_x_thread_phase0.py)
          echo "THREAD_JSON=$thread_json" > .x_thread.json

          python scripts/post_x_thread.py --thread-json "$thread_json" | tee .x_post_result.txt

          # Stage state file for PR if it exists.
          [ -f x/last_posted.json ] && git add x/last_posted.json || true

      - name: Generate Substack status heartbeat
        if: ${{ always() }}
        run: |
          python scripts/generate_substack_status.py --status "${{ job.status }}" --reason "${{ env.DAILY_FAIL_REASON || '' }}" --run-id "${{ github.run_id }}" --workflow "${{ github.workflow }}"

      - name: Stage tracked output files
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = "success" ]; then
            git add data/log.json logs/*.json data/live_portfolio_snapshot.json data/live_pnl_cache.json data/btcsignal_log.json btcsignal_log.json btcsignal_log_live.json
            [ -f substack/daily_latest.txt ] && git add substack/daily_latest.txt || true
            [ -f data/live_test_baseline.json ] && git add data/live_test_baseline.json || true
            [ -f data/btcsignal_execution_log.csv ] && git add data/btcsignal_execution_log.csv || true
            [ -f data/btcsignal_execute_state.json ] && git add data/btcsignal_execute_state.json || true
          fi
          [ -f substack/status.json ] && git add substack/status.json || true

      - name: Detect staged changes
        if: ${{ always() }}
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR for daily update
        if: ${{ always() && steps.changes.outputs.has_changes == 'true' }}
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: daily log update"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: "automation/daily-log-update-${{ github.run_id }}"
          base: "main"
          delete-branch: true
          title: "chore: daily log update"
          body: |
            Automated daily archive update.
          add-paths: |
            data/log.json
            logs/*.json
            data/live_portfolio_snapshot.json
            data/live_pnl_cache.json
            data/live_test_baseline.json
            data/btcsignal_execution_log.csv
            data/btcsignal_execute_state.json
            data/btcsignal_log.json
            btcsignal_log.json
            btcsignal_log_live.json
            substack/daily_latest.txt
            substack/status.json

      - name: Approve daily update PR
        if: ${{ always() && steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ steps.cpr.outputs.pull-request-number }}" --approve --body "Automated approval for daily data update."

      - name: Squash merge daily update PR
        if: ${{ always() && steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch

      - name: Verify daily update PR merged
        if: ${{ always() && steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr view "${{ steps.cpr.outputs.pull-request-number }}" \
            --json state,mergedAt,isDraft \
            --jq 'if .state == "MERGED" and .mergedAt != null then "ok" else error("daily_pr_not_merged") end'

      - name: Collect run context
        if: ${{ always() }}
        run: |
          echo "EXPECTED_DATE_UTC=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "PUBLISHED_AT_UTC=${PUBLISHED_AT_UTC:-UNAVAILABLE}" >> "$GITHUB_ENV"
          echo "PUBLISH_TARGET_UTC=${PUBLISH_TARGET_UTC:-UNAVAILABLE}" >> "$GITHUB_ENV"
          echo "PUBLISH_DELAY_SEC=${PUBLISH_DELAY_SEC:-UNAVAILABLE}" >> "$GITHUB_ENV"
          echo "PUBLISH_SLO_STATUS=${PUBLISH_SLO_STATUS:-UNAVAILABLE}" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("log.json")
          latest_date = "UNAVAILABLE"
          latest_updated = "UNAVAILABLE"
          try:
              j = json.loads(p.read_text(encoding="utf-8"))
              latest = j.get("latest") or {}
              latest_date = str(latest.get("date") or "UNAVAILABLE")
              latest_updated = str(latest.get("updated_at_utc") or "UNAVAILABLE")
          except Exception:
              pass
          with open(".run_ctx.env", "w", encoding="utf-8") as f:
              f.write(f"ACTUAL_LATEST_DATE={latest_date}\n")
              f.write(f"LATEST_UPDATED_AT_UTC={latest_updated}\n")
              f.write(f"PUBLISHED_AT_UTC={latest.get('published_at_utc','UNAVAILABLE') if isinstance(latest, dict) else 'UNAVAILABLE'}\n")
          PY
          cat .run_ctx.env >> "$GITHUB_ENV"

      - name: Notify Discord on daily run failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD1 || secrets.DISCORD }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: run-daily
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DAILY_FAIL_REASON: ${{ env.DAILY_FAIL_REASON || 'unknown' }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url || 'UNAVAILABLE' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit(0)
          msg = (
              f"🚨 Daily run failed\n"
              f"workflow={os.environ.get('WORKFLOW_NAME')}\n"
              f"job={os.environ.get('JOB_NAME')}\n"
              f"run_id={os.environ.get('RUN_ID')}\n"
              f"run_url={os.environ.get('RUN_URL','UNAVAILABLE')}\n"
              f"pr_url={os.environ.get('PR_URL','UNAVAILABLE')}\n"
              f"expected_date_utc={os.environ.get('EXPECTED_DATE_UTC','UNAVAILABLE')}\n"
              f"actual_latest_date={os.environ.get('ACTUAL_LATEST_DATE','UNAVAILABLE')}\n"
              f"latest_updated_at_utc={os.environ.get('LATEST_UPDATED_AT_UTC','UNAVAILABLE')}\n"
              f"reason={os.environ.get('DAILY_FAIL_REASON','daily_run_failed')}"
          )
          data = json.dumps({"content": msg}).encode("utf-8")
          req = urllib.request.Request(webhook, data=data, headers={"Content-Type": "application/json"}, method="POST")
          urllib.request.urlopen(req, timeout=10).read()
          PY

  run-daily-noop:
    needs: precheck-idempotency
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule != '32 11 * * *') && needs.precheck-idempotency.outputs.should_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: No-op due to idempotency guard
        run: |
          echo "NOOP: daily run skipped (${{ needs.precheck-idempotency.outputs.skip_reason || 'idempotency_guard' }})"

  missed-run-check:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '32 11 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify latest signal/proof date (UTC)
        id: verify
        run: |
          EXPECTED_DATE_UTC="$(date -u +%F)"
          export EXPECTED_DATE_UTC
          echo "EXPECTED_DATE_UTC=$EXPECTED_DATE_UTC" >> "$GITHUB_ENV"
          set +e
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = os.environ.get("EXPECTED_DATE_UTC", "").strip()
          p = Path("log.json")
          latest_date = "UNAVAILABLE"
          latest_updated = "UNAVAILABLE"
          try:
              j = json.loads(p.read_text(encoding="utf-8"))
              latest = j.get("latest") or {}
              latest_date = str(latest.get("date") or "UNAVAILABLE")
              latest_updated = str(latest.get("updated_at_utc") or "UNAVAILABLE")
          except Exception:
              pass
          with open(".missed_ctx.env", "w", encoding="utf-8") as f:
              f.write(f"ACTUAL_LATEST_DATE={latest_date}\n")
              f.write(f"LATEST_UPDATED_AT_UTC={latest_updated}\n")
          if not expected:
              print("ERROR: EXPECTED_DATE_UTC is missing")
              raise SystemExit(1)
          if latest_date != expected:
              raise SystemExit(1)
          PY
          rc=$?
          set -e
          cat .missed_ctx.env >> "$GITHUB_ENV"
          exit $rc

      - name: Notify Discord on missed run
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD1 || secrets.DISCORD }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: missed-run-check
        run: |
          python - <<'PY'
          import json, os, urllib.request
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit(0)
          msg = (
              f"⚠️ Missed daily signal/proof update\n"
              f"workflow={os.environ.get('WORKFLOW_NAME')}\n"
              f"job={os.environ.get('JOB_NAME')}\n"
              f"run_id={os.environ.get('RUN_ID')}\n"
              f"expected_date_utc={os.environ.get('EXPECTED_DATE_UTC','UNAVAILABLE')}\n"
              f"actual_latest_date={os.environ.get('ACTUAL_LATEST_DATE','UNAVAILABLE')}\n"
              f"latest_updated_at_utc={os.environ.get('LATEST_UPDATED_AT_UTC','UNAVAILABLE')}\n"
              f"reason=missed_run_check_failed"
          )
          data = json.dumps({"content": msg}).encode("utf-8")
          req = urllib.request.Request(webhook, data=data, headers={"Content-Type": "application/json"}, method="POST")
          try:
              urllib.request.urlopen(req, timeout=10).read()
          except Exception as e:
              print(f"WARN: missed-run-check Discord notify failed: {type(e).__name__}: {e}")
              raise SystemExit(0)
          PY
